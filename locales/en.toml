restore.note.keeps.before_state_not_established = "The plan keeps {package} under {provider}: the run's snapshot does not establish what {provider} held before the run, so it is not known to be the run's to remove."
restore.note.record_not_confirmed = "Run {id}'s record is not confirmed: the interrupted-run marker still names it. This plan is shown so you can review it before dealing with the marker; it is not offered for execution."
restore.note.outcome_uncertain = "A command the run dispatched did not end in a known exit status 0, so what it left on the machine is not known. This plan is built from the machine as it is now."

# The interrupted-run marker, in `doctor`, `history show` and
# `history acknowledge` (pass 08 slice 5, Part D): one text per state.
doctor.interrupted_run_not_checked = "Interrupted runs were not checked: this input is a recording or a snapshot file, or who this process runs as could not be established."
doctor.interrupted_run_none = "No interrupted run is recorded in this state directory."
doctor.interrupted_run_in_progress = "A MacPortsBrew run is in progress (it holds the run lock). A command that changes packages started now exits with code 7. This check briefly tests the lock, which can make a command starting at that same instant exit 7 as well."
doctor.interrupted_run_possibly_in_progress = "An interrupted-run marker is present and the run lock could not be tested, so a run may be in progress or may have been interrupted. Nothing was changed."
doctor.interrupted_run_marker_unreadable = "The interrupted-run marker cannot be read, so whether a run was interrupted is not known. Commands that change packages refuse until it is looked at; analysis, plan and dry runs still work. Look at the file interrupted-run.json in the state directory, but do not remove it: `history acknowledge` cannot read it either, and it may be the only trace. Nothing was changed."
doctor.interrupted_run_recorded_not_confirmed = "Run {run_id} was interrupted. Its record exists, but whether it reached the disk is not confirmed, and nothing has been deleted. It changed: {changed}. Snapshot taken first: {snapshot}. `macportsbrew history show {run_id}` shows it, `macportsbrew restore --plan --run {run_id}` plans the way back, and `macportsbrew history acknowledge {run_id} --yes` makes the record durable, checks it, and removes the marker."
doctor.interrupted_run_recorded_unreadable = "Run {run_id} was interrupted. A record is at its id but cannot be read as a record, so it cannot be trusted and the marker stays; `history acknowledge` refuses. Look at the file in the history directory. Snapshot taken first: {snapshot}."
doctor.interrupted_run_started_not_recorded = "Run {run_id} was interrupted and left no record. The provider may be half-changed. The marker names the snapshot taken first ({snapshot}), which with the marker is the only trace of the run: check the provider, then `macportsbrew history acknowledge {run_id} --yes` removes the marker. Until then commands that change packages refuse."
history.ack_nothing = "No interrupted run is recorded, so there is nothing to acknowledge ({run_id})."
history.ack_would_recorded = "Nothing was changed. With --yes this makes run {run_id}'s record durable on disk, checks that it reads back, and only then removes the marker. It cannot tell whether the record is the one the run wrote, so look at `history show {run_id}` first. No record or snapshot is deleted."
history.ack_would_unreadable = "Nothing was changed. Run {run_id}'s record cannot be read, so --yes would refuse and the marker would stay. To get out: move that record file out of the history directory (nothing here deletes it) and run this again; it will then report that the run left no record."
history.ack_would_not_recorded = "Nothing was changed. With --yes this removes the marker for run {run_id}. The marker and the snapshot it names are the only trace of the run; the snapshot is not deleted."
history.ack_done_recorded = "Run {run_id}: its record is durable and reads back, and the interrupted-run marker was removed. Commands that change packages can run again."
history.ack_done_not_recorded = "Run {run_id}: the interrupted-run marker was removed. The run left no record; the snapshot {snapshot} it took first was not deleted."
migrate.undo.snapshot = "Snapshot taken before the first change: {snapshot}."
migrate.undo.command = "To plan the way back: macportsbrew restore --run {run_id} --plan"
history.ack_snapshot_present = "The snapshot the marker names ({snapshot}) is present."
history.ack_snapshot_missing = "The snapshot the marker names ({snapshot}) is not in the state directory."
history.ack_snapshot_unreadable = "The snapshot the marker names ({snapshot}) is there but cannot be trusted or read."
history.ack_snapshot_none = "The marker names no snapshot."
