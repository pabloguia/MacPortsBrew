# --- doctor ---------------------------------------------------------------
"doctor.provider_present" = "{provider} {version} is present."
"doctor.provider_configuration_none" = "{provider}: none of the configuration files this tool reviews sets anything that would override how it runs {provider}."
"doctor.provider_configuration_outranks" = "{provider}: {file} sets {keys}. {provider} applies that file over the settings this tool runs it with, so its reads may not behave as this tool asks - they may report from somewhere else, or fetch differently - and a migration step that changes {provider} will be refused while the file sets them."
"doctor.provider_configuration_unreadable" = "{provider}: {file} exists but could not be read, or sets something this tool cannot name, so whether it overrides how this tool runs {provider} is unknown. A migration step that changes {provider} will be refused while it is."
"doctor.provider_configuration_unknown" = "{provider}: this input does not record the configuration files of {provider} - it is a recording, or a snapshot taken before they were recorded - so whether one overrides how this tool runs {provider} is unknown."
"doctor.provider_installed_once" = "{provider} is installed in one place."
"doctor.provider_installed_more_than_once" = "{provider} is installed in {count} places: {prefixes}. This tool runs the copy at {running}. A second copy can answer for a command or be updated by mistake; if a second copy is not deliberate (some people keep an Intel copy for software that needs it), decide which one to keep and remove the extra one with {provider}'s own tools - not the one at {running} unless you mean to."
"doctor.provider_installations_unknown" = "Whether {provider} is installed in more than one place is unknown: this input does not record it - it is a recording, or a snapshot taken before it was recorded - or none of the usual places holds it."
"doctor.provider_absent" = "{provider} is not installed here (it was not found where it is documented to live)."
# `{reason}` is deliberately absent. Every construction of
# `ProviderPresence::Broken` sets it to an `ErrorId::*.message_id()` - an
# identifier, never prose - so interpolating it printed
# "error.provider_unhealthy" at the user (F-38). It stays in the finding's
# params because `docs/schemas/doctor.v1.md` documents it as part of the
# `--json` contract, where a stable identifier is exactly what a machine wants.
# Resolving it through the catalogue instead was measured and rejected: it puts
# a two-sentence remediation paragraph inside a table cell.
"doctor.provider_broken" = "{provider} is present but not working. See Troubleshooting in the MacPortsBrew wiki."
"doctor.provider_prefix_is_not_absolute" = "The recorded location of {provider} is {prefix}, which is not an absolute path: the home directory was removed when this snapshot was captured, so a report can be shared safely. Analysis reports on {provider} normally. No step that would run it can be built, so it cannot be a migration destination, and it can only be a source with --retain-source, which leaves the installed package alone."
"doctor.provider_architecture_mismatch" = "{provider} is built for {provider_arch} on a {machine_arch} machine."
"doctor.provider_support" = "{provider} support for this machine is {tier} (source: {source}, read {readOn})."
"doctor.path_order" = "PATH resolves providers in this order: {order}."
"doctor.prefix_not_on_path" = "The prefix of {provider}, {prefix}, is not on PATH."

# One finding per ordered pair of present providers (DP-041). Severity is decided by
# PATH order; the {defence} sentence is chosen by what the affected provider's own
# tooling is recorded to do, so the two directions read differently.
"doctor.cross_provider_exposure" = "{intruder} (under {intruder_prefix}) and {affected} share this machine. About {affected}: {defence} This is a warning only when {intruder} is searched first on your PATH. Which copy of a tool runs when you type its name follows your PATH order, and that order is yours to arrange. This is a report only; nothing was changed."
"doctor.cross_provider_exposure_unadvised" = "{intruder} and {affected} share this machine, but nothing recorded says how {affected}'s own tooling guards its builds against {intruder}, so no direction-specific statement is made. This is a report only; nothing was changed."
# A snapshot with no recorded PATH is a capture that could not read one, not
# a machine with an empty PATH. Emitted instead of one false
# `prefix_not_on_path` per provider (F-34).
"doctor.path_unknown" = "This analysis carries no PATH, so nothing can be said about which provider's executables win. A recording does not capture the environment; run `doctor` live for the real answer."
"doctor.path_duplicate" = "PATH contains {entry} more than once."
"doctor.path_world_writable_precedes_system" = "PATH entry {entry} can be written by any user on this machine and is searched before the system directories, so anybody with an account here can decide what a command means for you."
"doctor.path_world_writable" = "PATH entry {entry} can be written by any user on this machine."
"doctor.path_group_writable" = "PATH entry {entry} can be written by every member of its group; on macOS that is commonly every administrator account."
"doctor.path_has_no_system_directory" = "PATH contains none of /usr/bin, /bin, /usr/sbin or /sbin, so the ordinary system programs are either unreachable or reached from somewhere else."
"doctor.path_missing" = "PATH entry {entry} is not a directory that exists."
"doctor.path_owner_writable" = "PATH entry {entry} belongs to you and you can write to it, so anything running as you - an installer, a package postinstall - can place a program there that is found before the system copy."
"doctor.path_finding_unknown" = "PATH entry {entry} has a problem this version does not recognise; the snapshot was written by a newer one."
"doctor.path_relative_precedes_system" = "PATH entry {entry} is not an absolute path and comes before the system directories, so which program you get depends on the directory you are standing in. An empty entry means the working directory."
"doctor.path_relative" = "PATH entry {entry} is not an absolute path, so what it resolves to depends on the directory you are standing in. An empty entry means the working directory."
"doctor.build_variable_names_prefix" = "{variable} names {provider}'s prefix; build-flag variables leak one provider into the other's builds and are never managed by MacPortsBrew."
"doctor.running_translated" = "This process runs under Rosetta translation on an Apple Silicon machine; provider detection reflects the translated view."
