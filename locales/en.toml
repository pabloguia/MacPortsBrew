# SPDX-License-Identifier: Apache-2.0
# English source catalogue. Keys are stable identifiers; see docs/spec/06-cli-and-ux.md.
#
# Format
# ------
# Flat `key = "text"` pairs. Keys are dotted, lower-case and stable: renaming
# one is a compatibility change, because every other catalogue under locales/
# is keyed by them and scripts/check-i18n-parity.sh fails on a missing or an
# orphaned key.
#
# Placeholders are `{name}` and are substituted with values the caller supplies.
# A literal brace is written `{{` or `}}`. Placeholder names are part of the
# key's contract and are never translated.
#
# Plurals use a minimal ICU-style select:
#
#   {count, plural, =0 {none at all} one {# package} other {# packages}}
#
# `#` renders the argument's value. An `=N` arm matches that exact value and
# wins over the category arms; `one` and `other` are chosen by the locale's
# plural rule. English and Spanish and Brazilian Portuguese distinguish
# one/other; Japanese and Chinese have only `other`, so a catalogue for those
# locales writes a single `other` arm. Never build a sentence by concatenating
# fragments (06-cli-and-ux.md, i18n).
#
# This file is the canonical source locale: every other catalogue is a
# translation of exactly these keys, and the pseudolocale (`--language qps`)
# is derived from it at runtime and has no file of its own.

