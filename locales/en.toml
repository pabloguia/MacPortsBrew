# (F-23). Wire it there or delete it; it is not dead text, it is unrouted.
cli.alias_note = "The short alias `mpb` runs the same program as `macportsbrew` and behaves identically."

# --- Errors -----------------------------------------------------------------
# One key per ErrorId::message_id(). Each carries a remediation sentence: a
# bare failure with no next step is not acceptable user-facing output
# (06-cli-and-ux.md, "Output contract"). `{detail}` is the untranslated
# diagnostic detail the domain attached.

error.usage = "That command line is not valid: {detail}. Run `macportsbrew --help` for the accepted commands and flags."
error.provider_not_found = "The provider was not found on this machine: {detail}. Run `macportsbrew doctor` to see which providers were detected."
error.provider_unhealthy = "The provider is present but did not answer correctly: {detail}. Run `macportsbrew doctor` for a full diagnosis before relying on its answers."
# A recording is not a snapshot: it comes from scripts/capture-fixture.sh and is
# consumed by --replay. Same exit code 8 as a snapshot - 06-cli-and-ux.md:68 is
# the category "8 stale/unusable input" - and a different remediation, which is
# the whole reason the identifier exists (F-41).
error.recording_unusable = "The recording could not be read, or its schema is from an incompatible version: {detail}. Capture a fresh one with `scripts/capture-fixture.sh`, or point --replay at a readable file."
error.provider_output_changed = "The provider's output did not have the shape this version expects: {detail}. The provider was probably updated; run `macportsbrew doctor --report` and attach the report to an issue."
error.provider_timeout = "The provider did not answer within its time limit: {detail}. A first Homebrew read on an empty cache downloads its catalogue, so a retry usually succeeds."
error.package_not_found = "That package is not present under that provider: {detail}. Run `macportsbrew list` to see what is there, and check the spelling."
error.capability_missing = "The provider cannot supply something this operation needs: {detail}. Run `macportsbrew doctor` to see which capabilities were detected on this machine."
error.snapshot_unusable = "The snapshot could not be read, or its schema is from an incompatible version: {detail}. Take a fresh one with `macportsbrew snapshot`, or point --from-snapshot at a readable file."
error.input_unusable = "The input this run was built from cannot be used: {detail}. Run `macportsbrew doctor` to see what this machine looks like; if the input came from a snapshot file or a recording, check whatever produced it."
error.policy_data_invalid = "The policy data could not be loaded or is inconsistent: {detail}. This is a defect in the build rather than something on this machine, so nothing you change here will fix it. Please report it and quote this message."
# MacPortsBrew's own state (the history store, the run lock, the interrupted-run
# marker), not an input the user named: the remedy is to look at the entry,
# never to re-capture. Something that cannot be trusted is never read as
# "nothing there", so this stops the command rather than guessing.
error.history_unusable = "MacPortsBrew's own state could not be read, or holds something that cannot be trusted, so nothing was changed: {detail}. Look at what that names in MacPortsBrew's state directory: an entry this version did not write, a record or marker altered after it was written, a lock file that is not the one this version creates, or a directory open to other users."
# Exit 7. The lock is held by a MacPortsBrew run, not by brew or port, and no
# process is named because none is recorded.
error.run_lock_held = "Another MacPortsBrew run is changing packages on this machine, so nothing was changed: {detail}. Wait for it to finish and run the command again; analysis, plan and dry runs do not need the lock and still work."
# Exit 4. The marker file and its directory are named separately on purpose: the
# default directory contains a space, and a pasted command line would be wrong.
error.run_interrupted = "An earlier run was interrupted and has not been looked at, so nothing was changed: {detail}. Analysis, plan and dry runs still work. First check whether MacPortsBrew's history holds a record for that run; if it does not, look at what that run changed on this machine. Then, only when no other MacPortsBrew run is active, remove the single file named interrupted-run.json from MacPortsBrew's state directory (the one MACPORTSBREW_STATE_DIR names, or Application Support/macportsbrew in your Library); a future release may do this for you. If you are unsure whether another run is active, wait for any other MacPortsBrew window to finish first."
error.safety_unverifiable = "A safety rule could not be evaluated from this input, so no plan was built and nothing was changed: {detail}. This is not something to fix on your machine — the fact is absent from the document itself. `analyze`, `status` and `explain` do not depend on it and still work."
error.provider_presence_unproven = "Nothing was changed, and this is not reported as already done: {detail}. Detection looks only where a provider is documented to live. If that provider is installed somewhere else, check it with that provider's own tools; if it is not installed at all, the package is under the provider you asked for and there is nothing to migrate."
error.safety_blocked = "A safety check stopped this operation and nothing was changed: {detail}. Read the finding, resolve it, and run the command again."
error.not_implemented_in_this_pass = "This build does not carry that operation yet: {detail}. It is specified but not shipped; the read-only commands are available now."
error.io = "A file could not be read or written: {detail}. Check that the path exists and that you have permission to it."
error.internal = "An internal error occurred: {detail}. This is a defect. Please report it with `macportsbrew doctor --report`."

# --- Reasons ----------------------------------------------------------------
# Policy and domain emit stable reason identifiers with named parameters; the
# UI renders `reason.<id>` with those parameters. Reason keys are added as the
# rules that emit them are written. `reason.unknown` is the fallback for an
# identifier this catalogue does not yet carry: it names the identifier rather
# than inventing a sentence, so a missing translation degrades to something
# a user can still report.

reason.unknown = "Reason {id}."

# A sentence uses only parameters the emitting rule always sets. Two rules
# attach a parameter that can legitimately be absent or empty — the successor
# named by a withdrawn package, and the list of version managers for a runtime
# family nobody has recorded one for — and a template that referenced those
# would render a bare `{replacedBy}` at the user. They stay on the reason for
# `--json` and for `explain`, where a missing value is simply a missing key,
# and the renderer presents them alongside the sentence rather than inside it.
#
# Parameters carrying a stable identifier from the domain are rendered through
# the matching label before substitution: `{class}` through `class.*`,
# `{cause}` through `source_build.*`, `{confidence}` and `{threshold}` through
# `confidence.*`, `{tier}` through `support.*`, `{state}` through `state.*`.
# A label is a noun-like name, so a sentence introduces it ("at
# level {confidence}") rather than using it as an adjective.

reason.class_requires_review = "{package} is classed as {class}, and packages in that class are never migrated automatically. A person decides this one."
reason.package_owns_persistent_data = "{package} belongs to the {family} family, which keeps data outside the package's own directory under {provider}. Moving it would leave that data behind, so it needs a data-and-service plan first."
reason.mapping_confidence_below_threshold = "No equivalent under {destination} reaches confidence level {threshold}: the best is at level {confidence}. Check whether {destination} has an equivalent before deciding."
reason.availability_unknown = "Whether {provider} would supply {package} ready-built or compile it here could not be determined. An unknown is not a yes."
reason.reverse_dependencies_present = "{count, plural, one {# package under {provider} depends} other {# packages under {provider} depend}} on this one, and removing or moving it on its own can break them."
reason.destination_deprecated = "{destination} marks its equivalent {state}. Moving onto a package its own provider has withdrawn is not a decision this tool makes for you."
reason.provider_configuration_outranks = "The configuration of {provider} ({file}) sets {keys}, which {provider} applies over the settings this tool would run it with. A step that changes {provider} is refused while it does."
reason.provider_configuration_unreadable = "The configuration file {file} of {provider} exists but could not be read, or sets something this tool cannot name, so whether it overrides how this tool runs {provider} is unknown. A step that changes {provider} is refused while it is."
reason.provider_configuration_unknown = "Whether the configuration of {provider} overrides the settings this tool would run it with is not known from this input - it was read from a recording or a snapshot that does not record it. A step that changes {provider} is refused while it is unknown."
reason.runtime_family_managed_elsewhere = "{family} is a language runtime, and a version manager usually handles one better than either package manager does. This is a suggestion; nothing has been changed."
reason.source_support_ending = "{provider} has published {endDate} as the end of its support for this machine, and already reports this machine as {tier}. {destination} offers a ready-built equivalent today."
reason.destination_offers_prebuilt = "Under {source} this would be compiled here ({cause}), while {destination} has it ready-built for this machine."
reason.destination_unsupported_here = "{destination} states it does not support this machine, so it is not somewhere to move to. The package stays where it is."
reason.present_under_both_providers = "It is already present under both {primary} and {other}. Keeping both is a supported end state; {primary} is suggested as the one your shell reaches first ({criterion})."
reason.coexistence_requested = "You asked for this package under both providers. {primary} is suggested as the one your shell reaches first, with {other} alongside it."
reason.keep_source_default = "Nothing argues for moving {package}, so it stays under {provider}."
reason.no_alternative_provider_present = "{provider} is the only package manager on this machine carrying {package}, so there is nowhere to move it to."

