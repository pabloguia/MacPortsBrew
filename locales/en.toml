# --- status ---------------------------------------------------------------
"status.machine_heading" = "Machine"
"status.machine_line" = "macOS {macos}, {arch}, {translation}"
"status.providers_heading" = "Providers"
# `topLevel` here is the default-view population, which since DP-012 includes
# packages whose ownership is `UNKNOWN` — not only those a provider records as
# requested. `count.packages_with_top_level` below counts the narrower set and
# still says "top-level", because that one is fed by `topLevelCount`.
"status.summary_line" = "{topLevel} packages in the default view; {manualReview} need manual review. Policy {policyVersion}."
# Printed only when the count is non-zero. A replayed analysis cannot read a
# cask's on-disk receipt, so it reports fewer top-level packages than the same
# machine does live; without this line the count is the only clue (F-39).
#
# It names both causes and asserts neither. The first draft said "a replayed or
# snapshot analysis cannot read evidence on the machine's own disk", which is
# false on a live run - there, an unknown row means the provider genuinely kept
# no record. A summary line that explains the wrong cause is worse than one that
# explains none; `doctor` is where a diagnosis belongs.
"status.ownership_unknown" = "Ownership is unknown for {count} row(s): the provider kept no record, or this analysis could not read one."
