"migrate.history_not_recognised.record_from_the_future" = "O histórico tem uma execução com horário posterior a esta, então o relógio mudou e a ordem das execuções não é confiável. A migração é planejada de novo."
"migrate.history_not_recognised.destination_not_active" = "O histórico mostra que a execução {run} concluiu esta migração, mas o que foi lido agora não mostra o destino com o pacote ativo, então ela é planejada de novo."
