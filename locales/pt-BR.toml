# --- doctor ---------------------------------------------------------------
"doctor.provider_present" = "{provider} {version} está presente."
"doctor.provider_configuration_none" = "{provider}: nenhum dos arquivos de configuração que esta ferramenta examina define algo que mudaria a forma como ela executa {provider}."
"doctor.provider_configuration_outranks" = "{provider}: {file} define {keys}. {provider} aplica esse arquivo por cima das configurações com que esta ferramenta o executa, então as leituras dele podem não se comportar como esta ferramenta pede - podem trazer informações de outro lugar, ou buscar de outra forma - e uma etapa de migração que altere {provider} será recusada enquanto o arquivo definir isso."
"doctor.provider_configuration_unreadable" = "{provider}: {file} existe, mas não pôde ser lido, ou define algo que esta ferramenta não sabe nomear, então não se sabe se ele muda a forma como esta ferramenta executa {provider}. Uma etapa de migração que altere {provider} será recusada enquanto isso não for esclarecido."
"doctor.provider_configuration_unknown" = "{provider}: esta entrada não registra os arquivos de configuração de {provider} - é uma gravação, ou um snapshot tirado antes de eles passarem a ser registrados - então não se sabe se algum deles muda a forma como esta ferramenta executa {provider}."
"doctor.provider_configuration_analytics" = "{provider}: {file} define {keys}, que decide se {provider} envia suas próprias estatísticas de uso. Esta ferramenta nunca guarda o valor, então não sabe dizer como está definido; se ele as ativar, {provider} pode enviar estatísticas durante as leituras que esta ferramenta lhe pede. O MacPortsBrew em si não envia nada."
"doctor.provider_reads_offline" = "{provider}: as leituras que esta ferramenta lhe pede são respondidas com dados que já estão nesta máquina, sem a rede, a menos que um aviso sobre a configuração do provedor diga o contrário. O MacPortsBrew não faz nenhum acesso à rede por conta própria."
"doctor.provider_read_may_reach_network" = "{provider}: seu índice local de metadados está ausente, então a primeira leitura que esta ferramenta lhe pedir pode baixá-lo pela rede, por conta do próprio {provider}. Sem rede, essa leitura falha por tempo esgotado em vez de dar um palpite. O MacPortsBrew não faz nenhum acesso à rede por conta própria."
"doctor.provider_network_use_unknown" = "{provider}: não se sabe, por esta entrada, se uma leitura de {provider} pode acessar a rede - não foi registrado se seus metadados locais estão presentes, como numa gravação ou num snapshot mais antigo. O MacPortsBrew não faz nenhum acesso à rede por conta própria."
"doctor.provider_installed_once" = "{provider} está instalado em um só lugar."
"doctor.provider_installed_more_than_once" = "{provider} está instalado em {count} lugares: {prefixes}. Esta ferramenta executa a cópia em {running}. Uma segunda cópia pode responder por um comando ou ser atualizada por engano; se uma segunda cópia não for proposital (há quem mantenha uma cópia Intel para programas que precisam dela), decida qual manter e remova a cópia extra com as ferramentas do próprio {provider} - não a que está em {running}, a menos que seja isso que você quer."
"doctor.provider_installations_unknown" = "Não se sabe se {provider} está instalado em mais de um lugar: esta entrada não registra isso - é uma gravação, ou um snapshot tirado antes de isso passar a ser registrado - ou nenhum dos lugares de costume o contém."
"doctor.provider_absent" = "{provider} não está instalado aqui (não foi encontrado onde a documentação diz que ele fica)."
"doctor.provider_broken" = "{provider} está presente, mas não está funcionando. Veja a página Troubleshooting (solução de problemas) na wiki do MacPortsBrew."
"doctor.provider_prefix_is_not_absolute" = "O local registrado de {provider} é {prefix}, que não é um caminho absoluto: o diretório pessoal foi removido quando este snapshot foi capturado, para que um relatório possa ser compartilhado com segurança. A análise informa sobre {provider} normalmente. Nenhuma etapa que o executaria pode ser montada, então ele não pode ser destino de uma migração, e só pode ser origem com --retain-source, que deixa o pacote instalado como está."
"doctor.provider_architecture_mismatch" = "{provider} foi compilado para {provider_arch} em uma máquina {machine_arch}."
"doctor.provider_support" = "O suporte de {provider} para esta máquina está no nível {tier} (fonte: {source}, lido em {readOn})."
"doctor.path_order" = "O PATH encontra os gerenciadores de pacotes nesta ordem: {order}."
"doctor.prefix_not_on_path" = "O prefixo de {provider}, {prefix}, não está no PATH."
"doctor.cross_provider_exposure" = "{intruder} (em {intruder_prefix}) e {affected} dividem esta máquina. Sobre {affected}: {defence} Isto é um aviso apenas quando {intruder} é pesquisado primeiro no seu PATH. Qual cópia de uma ferramenta roda quando você digita o nome dela depende da ordem do seu PATH, e essa ordem é sua para organizar. Isto é apenas um relatório; nada foi alterado."
"doctor.cross_provider_exposure_unadvised" = "{intruder} e {affected} dividem esta máquina, mas nada registrado diz como as ferramentas de {affected} protegem as compilações dele contra {intruder}, então nenhuma afirmação sobre a direção é feita. Isto é apenas um relatório; nada foi alterado."
