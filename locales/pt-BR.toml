# O marcador de execução interrompida, em `doctor`, `history show` e
# `history acknowledge` (passo 08, fatia 5, Parte D): um texto por estado.
doctor.interrupted_run_not_checked = "Execuções interrompidas não foram verificadas: esta entrada é uma gravação ou um arquivo de snapshot, ou não foi possível saber como este processo roda."
doctor.interrupted_run_none = "Nenhuma execução interrompida está registrada neste diretório de estado."
doctor.interrupted_run_in_progress = "Uma execução do MacPortsBrew está em andamento (ela segura a trava de execução). Um comando que altera pacotes iniciado agora sai com o código 7. Esta verificação testa a trava por um instante, o que também pode fazer sair com 7 um comando que comece nesse mesmo instante."
doctor.interrupted_run_possibly_in_progress = "Há um marcador de execução interrompida e a trava de execução não pôde ser testada, então uma execução pode estar em andamento ou ter sido interrompida. Nada foi alterado."
doctor.interrupted_run_marker_unreadable = "O marcador de execução interrompida não pode ser lido, então não se sabe se uma execução foi interrompida. Comandos que alteram pacotes recusam até que isso seja examinado; análise, plano e simulações continuam funcionando. Examine o arquivo interrupted-run.json no diretório de estado, mas não o remova: `history acknowledge` também não consegue lê-lo, e ele pode ser o único rastro. Nada foi alterado."
doctor.interrupted_run_recorded_not_confirmed = "A execução {run_id} foi interrompida. O registro dela existe, mas não está confirmado que chegou ao disco, e nada foi apagado. Ela alterou: {changed}. Snapshot feito primeiro: {snapshot}. `macportsbrew history show {run_id}` o mostra, `macportsbrew restore --plan --run {run_id}` monta o plano de volta, e `macportsbrew history acknowledge {run_id} --yes` torna o registro durável, o confere e remove o marcador."
doctor.interrupted_run_recorded_unreadable = "A execução {run_id} foi interrompida. Há um registro no id dela, mas ele não pode ser lido como registro, então não é confiável e o marcador permanece; `history acknowledge` recusa. Examine o arquivo no diretório de histórico. Snapshot feito primeiro: {snapshot}."
doctor.interrupted_run_started_not_recorded = "A execução {run_id} foi interrompida e não deixou registro. O provedor pode ter ficado alterado pela metade. O marcador cita o snapshot feito primeiro ({snapshot}) que, junto com o marcador, é o único rastro da execução: confira o provedor, e então `macportsbrew history acknowledge {run_id} --yes` remove o marcador. Até lá, comandos que alteram pacotes recusam."
history.ack_nothing = "Nenhuma execução interrompida está registrada, então não há nada a reconhecer ({run_id})."
history.ack_would_recorded = "Nada foi alterado. Com --yes isto torna o registro da execução {run_id} durável no disco, confere que ele é relido, e só então remove o marcador. Não é possível saber se o registro é o que a execução escreveu, então veja `history show {run_id}` antes. Nenhum registro ou snapshot é apagado."
history.ack_would_unreadable = "Nada foi alterado. O registro da execução {run_id} não pode ser lido, então --yes recusaria e o marcador permaneceria. Para sair disso: mova esse arquivo de registro para fora do diretório de histórico (nada aqui o apaga) e rode isto de novo; ele dirá então que a execução não deixou registro."
history.ack_would_not_recorded = "Nada foi alterado. Com --yes isto remove o marcador da execução {run_id}. O marcador e o snapshot que ele cita são o único rastro da execução; o snapshot não é apagado."
history.ack_done_recorded = "Execução {run_id}: o registro dela está durável e é relido, e o marcador de execução interrompida foi removido. Comandos que alteram pacotes podem rodar de novo."
history.ack_done_not_recorded = "Execução {run_id}: o marcador de execução interrompida foi removido. A execução não deixou registro; o snapshot {snapshot} que ela fez primeiro não foi apagado."
