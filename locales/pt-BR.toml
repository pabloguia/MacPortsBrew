# SPDX-License-Identifier: Apache-2.0
# Brazilian Portuguese catalogue. A translation of exactly the keys of
# locales/en.toml, which is the canonical source; see docs/spec/06-cli-and-ux.md.
# Placeholders and plural arms are byte-identical to English. Brazilian
# Portuguese takes the `one` arm at 0 and 1.

# --- Program identity -------------------------------------------------------

cli.about = "Veja o que o Homebrew e o MacPorts têm instalado, compare os dois pacote a pacote e planeje uma migração em qualquer direção; os dois são tratados como iguais. Esta versão lê e planeja; ela não altera nada."
cli.alias_note = "O nome curto `mpb` executa o mesmo programa que `macportsbrew` e se comporta exatamente igual."

# --- Errors -----------------------------------------------------------------

error.usage = "Essa linha de comando não é válida: {detail}. Execute `macportsbrew --help` para ver os comandos e as opções aceitos."
error.provider_not_found = "O gerenciador de pacotes não foi encontrado nesta máquina: {detail}. Execute `macportsbrew doctor` para ver quais gerenciadores de pacotes foram detectados."
error.provider_unhealthy = "O gerenciador de pacotes está presente, mas não respondeu corretamente: {detail}. Execute `macportsbrew doctor` para um diagnóstico completo antes de confiar nas respostas dele."
error.recording_unusable = "A gravação não pôde ser lida, ou o esquema dela é de uma versão incompatível: {detail}. Capture uma nova com `scripts/capture-fixture.sh`, ou aponte --replay para um arquivo legível."
error.provider_output_changed = "A saída do gerenciador de pacotes não tinha o formato que esta versão espera: {detail}. Provavelmente ele foi atualizado; execute `macportsbrew doctor --report` e anexe o relatório a um relato de problema (issue)."
error.provider_timeout = "O gerenciador de pacotes não respondeu dentro do tempo limite: {detail}. A primeira leitura do Homebrew com o cache vazio baixa o catálogo dele, então tentar de novo geralmente funciona."
error.package_not_found = "Esse pacote não está presente nesse gerenciador de pacotes: {detail}. Execute `macportsbrew list` para ver o que existe lá e confira a grafia."
error.capability_missing = "O gerenciador de pacotes não consegue fornecer algo de que esta operação precisa: {detail}. Execute `macportsbrew doctor` para ver quais recursos foram detectados nesta máquina."
error.snapshot_unusable = "O snapshot não pôde ser lido, ou o esquema dele é de uma versão incompatível: {detail}. Tire um novo com `macportsbrew snapshot`, ou aponte --from-snapshot para um arquivo legível."
error.input_unusable = "A entrada usada nesta execução não pode ser aproveitada: {detail}. Execute `macportsbrew doctor` para ver como esta máquina está; se a entrada veio de um arquivo de snapshot ou de uma gravação, verifique o que a produziu."
error.policy_data_invalid = "Os dados de política não puderam ser carregados ou estão inconsistentes: {detail}. Isso é um defeito da própria versão do programa, não algo nesta máquina, então nada que você mude aqui vai resolver. Por favor, relate o problema e cite esta mensagem."
error.history_unusable = "O estado do próprio MacPortsBrew não pôde ser lido, ou contém algo em que não se pode confiar, então nada foi alterado: {detail}. Examine o que essa mensagem indica no diretório de estado do MacPortsBrew: uma entrada que esta versão não escreveu, um registro ou marcador alterado depois de escrito, um arquivo de trava que não é o que esta versão cria, ou um diretório aberto a outros usuários."
error.run_lock_held = "Outra execução do MacPortsBrew está alterando pacotes nesta máquina, então nada foi alterado: {detail}. Espere ela terminar e execute o comando de novo; análise, plano e simulações (dry run) não precisam da trava e continuam funcionando."
error.run_interrupted = "Uma execução anterior foi interrompida e ainda não foi examinada, então nada foi alterado: {detail}. Análise, plano e simulações (dry run) continuam funcionando. Primeiro verifique se o histórico do MacPortsBrew tem um registro dessa execução; se não tiver, examine o que essa execução alterou nesta máquina. Depois, somente quando nenhuma outra execução do MacPortsBrew estiver ativa, remova o único arquivo chamado interrupted-run.json do diretório de estado do MacPortsBrew (o indicado por MACPORTSBREW_STATE_DIR, ou Application Support/macportsbrew na sua pasta Library); uma versão futura poderá fazer isso por você. Se não tiver certeza se outra execução está ativa, espere primeiro qualquer outra janela do MacPortsBrew terminar."
error.safety_unverifiable = "Uma regra de segurança não pôde ser avaliada a partir desta entrada, então nenhum plano foi montado e nada foi alterado: {detail}. Não é algo a corrigir na sua máquina — o fato está ausente do próprio documento. `analyze`, `status` e `explain` não dependem dele e continuam funcionando."
error.provider_presence_unproven = "Nada foi alterado, e isto não é informado como já feito: {detail}. A detecção procura apenas onde a documentação diz que um gerenciador de pacotes fica. Se esse gerenciador de pacotes estiver instalado em outro lugar, verifique com as próprias ferramentas dele; se ele não estiver instalado, o pacote está no gerenciador de pacotes que você pediu e não há nada a migrar."
error.safety_blocked = "Uma verificação de segurança interrompeu esta operação e nada foi alterado: {detail}. Leia o problema encontrado, resolva-o e execute o comando de novo."
error.not_implemented_in_this_pass = "Esta versão ainda não inclui essa operação: {detail}. Ela está especificada, mas ainda não foi lançada; os comandos somente leitura já estão disponíveis."
error.io = "Um arquivo não pôde ser lido ou gravado: {detail}. Verifique se o caminho existe e se você tem permissão de acesso a ele."
error.internal = "Ocorreu um erro interno: {detail}. Isso é um defeito. Por favor, relate-o com `macportsbrew doctor --report`."

# --- Reasons ----------------------------------------------------------------

reason.unknown = "Motivo {id}."

reason.class_requires_review = "{package} está classificado como {class}, e pacotes dessa classe nunca são migrados automaticamente. Uma pessoa decide este caso."
reason.package_owns_persistent_data = "{package} pertence à família {family}, que guarda dados fora do diretório do próprio pacote em {provider}. Movê-lo deixaria esses dados para trás, então ele precisa antes de um plano para os dados e o serviço."
reason.mapping_confidence_below_threshold = "Nenhum equivalente em {destination} atinge o nível de confiança {threshold}: o melhor está no nível {confidence}. Verifique se {destination} tem um equivalente antes de decidir."
reason.availability_unknown = "Não foi possível determinar se {provider} forneceria {package} já compilado ou o compilaria aqui. Não saber não é o mesmo que sim."
reason.reverse_dependencies_present = "{count, plural, one {# pacote em {provider} depende} other {# pacotes em {provider} dependem}} deste, e removê-lo ou movê-lo sozinho pode quebrá-los."
reason.destination_deprecated = "{destination} marca o equivalente dele como {state}. Mudar para um pacote que o próprio gerenciador de pacotes retirou não é uma decisão que esta ferramenta toma por você."
reason.provider_configuration_outranks = "A configuração de {provider} ({file}) define {keys}, que {provider} aplica por cima das configurações com que esta ferramenta o executaria. Uma etapa que altere {provider} é recusada enquanto isso acontecer."
reason.provider_configuration_unreadable = "O arquivo de configuração {file} de {provider} existe, mas não pôde ser lido, ou define algo que esta ferramenta não sabe nomear, então não se sabe se ele muda a forma como esta ferramenta executa {provider}. Uma etapa que altere {provider} é recusada enquanto isso não for esclarecido."
reason.provider_configuration_unknown = "Não se sabe, a partir desta entrada, se a configuração de {provider} se sobrepõe às configurações com que esta ferramenta o executaria - ela foi lida de uma gravação ou de um snapshot que não registra isso. Uma etapa que altere {provider} é recusada enquanto isso for desconhecido."
reason.runtime_family_managed_elsewhere = "{family} é um ambiente de execução de linguagem, e um gerenciador de versões costuma cuidar dele melhor do que qualquer um dos gerenciadores de pacotes. Isto é uma sugestão; nada foi alterado."
reason.source_support_ending = "{provider} publicou {endDate} como o fim do suporte para esta máquina, e já classifica esta máquina no nível {tier}. {destination} oferece hoje um equivalente já compilado."
reason.destination_offers_prebuilt = "Em {source} isto seria compilado aqui ({cause}), enquanto {destination} o tem já compilado para esta máquina."
reason.destination_unsupported_here = "{destination} declara que não oferece suporte a esta máquina, então não é um destino possível. O pacote fica onde está."
reason.present_under_both_providers = "Ele já está presente tanto em {primary} quanto em {other}. Manter os dois é um resultado final aceito; {primary} é sugerido como o que o seu shell encontra primeiro ({criterion})."
reason.coexistence_requested = "Você pediu este pacote nos dois gerenciadores de pacotes. {primary} é sugerido como o que o seu shell encontra primeiro, com {other} ao lado."
reason.keep_source_default = "Nada justifica mover {package}, então ele fica em {provider}."
reason.no_alternative_provider_present = "{provider} é o único gerenciador de pacotes nesta máquina que tem {package}, então não há para onde movê-lo."

