[package]
name = "macportsbrew"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
default-run = "macportsbrew"

# `mpb` is an equal alias, not a wrapper (06-cli-and-ux.md): both binaries are
# built from the same source file and behave identically.
[[bin]]
name = "macportsbrew"
path = "src/main.rs"

[[bin]]
name = "mpb"
path = "src/main.rs"

[lib]
name = "macportsbrew"
path = "src/lib.rs"

[dependencies]
macportsbrew-domain = { path = "../domain" }
# The UI renders what the policy engine emits, so it is the layer that can
# check its own catalogue covers the engine's reason vocabulary. The layering
# (scripts/check-layering.sh) allows the CLI to depend on every layer.
macportsbrew-policy = { path = "../policy" }
serde.workspace = true
toml.workspace = true
unicode-width.workspace = true
macportsbrew-application = { path = "../application" }
macportsbrew-adapters = { path = "../adapters" }
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Dev-only, and only to verify ADR-0002's open question: that the candidate TUI
# crate measures East Asian text in display width the way this crate's renderer
# does. No TUI ships in this pass, so this dependency stays out of the binary.
# `default-features = false` keeps the terminal backends (and their C bindings)
# out of the graph: the test writes into an in-memory buffer.
ratatui = { version = "0.30.2", default-features = false }

[lints]
workspace = true
