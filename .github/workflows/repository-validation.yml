# Repository validation: the authority for "valid" (docs/spec/07-quality-and-testing.md).
#
# One implementation, scripts/validate.sh, reached three ways: here, by a
# contributor before pushing, and by the agent's Stop gate. The ubuntu job
# runs the documentation checks, the hook tests and the quick validation;
# the macOS matrix runs the full suite natively on both architectures and
# asserts the deployment target on the built artifacts (ADR-0002).
#
# Runner labels come from docs/research/R-10-ci-runners.md (read 2026-09-02):
# macos-15-intel and macos-26-intel are hosted x86_64 runners, free on public
# repositories; macos-latest is arm64 and a moving target, so labels are
# explicit. Every macOS job sets the Homebrew quieting variables because the
# images ship a live Homebrew that would otherwise auto-update mid-job; the
# adapters run on fixtures regardless. scripts/support-matrix.sh derives the
# published support matrix from the labels below, so adding or removing a
# job changes what the documentation may claim.
name: Repository validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      # Shellcheck is a `validate.sh` stage as of F-45, and the Repository gate
      # below runs it. Left here it was a fourth check with a second spelling,
      # which is the defect that commit set out to remove. The install step
      # above stays: the gate needs the binary.

      # Before the hook tests, not after: the stop-gate case in test-hooks.sh runs
      # `scripts/validate.sh --quick`, which needs the pinned toolchain, and on a
      # runner without it that case fails for a reason that is not the hook's.
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-09-02
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Hooks decide what the specification says they decide
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: .claude/hooks/test-hooks.sh

      - name: Repository gate
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          # CI is the authority: the full suite, not the changed-files subset.
          MPB_GATE_FULL: "1"
        run: .claude/hooks/stop-gate.sh

      # The LICENSE digest and the support-matrix check moved into
      # scripts/validate.sh, which the Repository gate above already runs.
      # CLAUDE.md: validate.sh is the one implementation of valid, and a check
      # anywhere else is a check with a second spelling - the licence digest was
      # duplicated here, and this step used `sha256sum`, which a stock macOS does
      # not have, so it could never have run in the macOS job (F-45).

      - name: Dependency licences (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  macos:
    name: macos (${{ matrix.runner }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Tested: what these jobs execute. Everything else in the support
        # matrix is best-effort or unsupported (docs/support-matrix.md).
        runner: [macos-26, macos-26-intel, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-09-02
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Machine facts, for the record
        run: |
          sw_vers
          uname -m
          rustc --print deployment-target --target x86_64-apple-darwin
          rustc --print deployment-target --target aarch64-apple-darwin

      # `validate.sh` has a shellcheck stage (F-45) and the macOS runner image does
      # not ship the binary: the stage failed with "command not found" on all four
      # runners while everything else passed. The Linux job installs it the same
      # way, from apt.
      - name: Install shellcheck
        run: brew install shellcheck

      - name: Full validation, including the deployment-target assertion on both artifacts
        run: scripts/validate.sh --full

      - name: Hook tests on macOS (the hooks run here, not on Linux)
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: .claude/hooks/test-hooks.sh

      # The fixture matrix moved into scripts/validate.sh, which the step
      # above runs with --full (F-45).

  coverage:
    name: coverage floors per layer
    needs: validate
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, resolved 2026-09-02
        with:
          toolchain: 1.98.0
          components: llvm-tools-preview
      # Pinned to the generic v2 commit with the tool named explicitly, not to
      # the `@cargo-llvm-cov` tag. That tag resolves to a *published variant*
      # commit whose action.yml carries `default: cargo-llvm-cov`, so pinning it
      # by SHA does work — but it makes the tool a property of which commit was
      # chosen rather than of anything readable in this file, and it would stop
      # working the day the maintainer changes how variants are published. The
      # `tool` input is `required: true` on the generic commit (checked at
      # e67fa11c, 2026-09-02), so naming it is the form that cannot silently
      # mean something else.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov
      - name: Coverage per layer against the floors in 07-quality-and-testing.md
        run: scripts/check-coverage.sh
