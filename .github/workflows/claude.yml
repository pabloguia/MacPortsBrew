# Respond to @claude mentions on issues and pull requests.
#
# Dormant until the repository has a GitHub remote (DP-007) and one of the
# authentication secrets below is set. See .claude/README.md.
#
# Interactive mode: no `prompt` input, so Claude waits for the trigger phrase.
# Source: https://code.claude.com/docs/en/github-actions (read 2026-09-02).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # The trigger phrase alone is not authorisation: on a public repository
    # anyone can write `@claude` in a comment, and this job checks out the
    # head, runs with `contents: write` and holds an API key. The association
    # test is what makes the trigger a request from someone who already has
    # write access. Both events this workflow listens to carry
    # `github.event.comment.author_association`; adding an event without one
    # means adding its own test here. GitHub's association values are
    # documented at
    # https://docs.github.com/en/graphql/reference/enums#commentauthorassociation
    # (read 2026-09-02).
    #
    # Two caveats, so nobody reads this gate as stronger than it is. `MEMBER`
    # means organisation membership, not write access. `COLLABORATOR` is
    # weaker still: GitHub assigns it to anyone *invited* to the repository,
    # including read-only and triage-only collaborators - so an invitee who
    # cannot push can nonetheless start a job holding the API key and
    # `contents: write`. Acceptable for a repository with no collaborators,
    # and a decision to revisit the day one is added: narrow to `OWNER`, or
    # gate on a maintainers team.
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Required by the action's default GitHub App authentication, not left
      # over from an OIDC step - https://code.claude.com/docs/en/github-actions
      # (read 2026-09-05), whose own example carries it.
      id-token: write
      actions: read
    env:
      # Marks the run as unattended. guard-protected-paths.sh reads it and
      # refuses edits to docs/decisions-pending.md and docs/adr/ - the
      # MUST NOT in docs/spec/11-agentic-sdlc.md that until now was asserted
      # in this comment and enforced nowhere.
      MPB_UNATTENDED: "1"
      # The Stop gate would run cargo clippy/test on the checked-out head
      # with this job's secrets in the environment. Disabled here on purpose;
      # the same gate runs in repository-validation.yml with no secret. Per
      # docs/spec/11-agentic-sdlc.md this disclosure is the price of the
      # escape hatch.
      MPB_SKIP_STOP_GATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@fa2b2666b747000bf42767d1f332065b375e3c8f # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # The checked-in permissions apply here too: no elevation, no mutating
          # brew/port command. contents: write is for pull-request branches;
          # the default branch is kept out of reach by branch protection,
          # enabled when the workflows are activated (.claude/README.md). An
          # unattended run never merges, releases, or resolves a
          # decisions-pending item - docs/spec/11-agentic-sdlc.md.
          settings: .claude/settings.json
          # Capability by enumeration (docs/spec/11-agentic-sdlc.md): the run
          # can read, edit and inspect git. It does NOT build or test: a
          # pull-request head can carry a build.rs, a proc macro or a #[test]
          # that runs with this job's secrets. repository-validation.yml runs
          # the build and tests without any secret. `settings:` grants the
          # allow rules in .claude/settings.json too (github-actions docs,
          # read 2026-09-02: `--allowedTools` and a settings allow rule are
          # alternative grants), and those include cargo build/test - so the
          # cargo verbs are denied here explicitly; deny beats allow at every
          # scope.
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status *),Bash(git diff *),Bash(git log *),Bash(cargo fmt -- --check)"
            --disallowedTools "Bash(cargo build*),Bash(cargo check*),Bash(cargo clippy*),Bash(cargo test*),Bash(cargo nextest*),Bash(cargo run*),Bash(cargo bench*),Bash(cargo doc*)"
