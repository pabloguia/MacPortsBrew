# Automatic pull request review using Anthropic's own code-review plugin.
#
# Dormant until the repository has a GitHub remote (DP-007).
# Source: https://code.claude.com/docs/en/github-actions (read 2026-09-02).
#
# Review only. This workflow has read permissions on contents and pull requests
# and cannot push, merge or release - docs/spec/11-agentic-sdlc.md requires that
# no unattended agent run holds those.
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
