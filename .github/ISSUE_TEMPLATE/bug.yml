# SPDX-License-Identifier: Apache-2.0
name: Bug report
description: MacPortsBrew did something wrong, crashed, or reported something that is not true.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Before you fill this in:

        - **Never paste secrets, tokens or credentials.** MacPortsBrew never
          needs them and cannot use them.
        - **If this is a security problem, do not file it here.** See
          `SECURITY.md`.
        - `macportsbrew doctor --report <new-file>` writes a diagnostic file with
          most of what is asked below, without your user name or home folder
          path. It does list every installed package. Read it before attaching it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what it printed, and what you expected instead.
      placeholder: |
        I ran `macportsbrew analyze` and ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands, in order. Include the exit code if a command failed.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.6.2"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - Intel x86_64
        - Apple Silicon arm64
        - Apple Silicon running under Rosetta translation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: mpb-version
    attributes:
      label: MacPortsBrew version
      description: "The full output of `macportsbrew --version` — all four lines."
      placeholder: |
        macportsbrew 0.1.0
        policy 2026.10.12-4
        target x86_64-apple-darwin
        commit 0123abc
      render: text
    validations:
      required: true

  - type: input
    id: policy-version
    attributes:
      label: Policy version
      description: "Printed at the end of `macportsbrew status`, and in every `--json` payload."
      placeholder: "2026.10.12-4"
    validations:
      required: true

  - type: input
    id: provider-versions
    attributes:
      label: Provider versions
      description: "Whichever you have. `brew --version`, `port version`."
      placeholder: "homebrew 7.0.4, macports 2.12.6"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: doctor --report output
      description: "Run `macportsbrew doctor --report <new-file>`, read the file, and paste it here. It leaves out your user name and home folder path; `PATH` entries a finding mentions show your home folder as `~`, and other environment variables are named without their values. It also lists every installed package. Read it before you share it."
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I have checked that this report contains no secrets, tokens or credentials.
          required: true
