# Throwaway probe for the MacPortsBrew owner checklist, check 3 [SR2 B-L5]:
# runs the release workflow's credential-import sequence once on hosted
# runners, with self-signed THROWAWAY identities generated here. No secret is
# used. Lives only on the temporary branch probe/p12-import; never merged.
# The import step body is copied verbatim from
# pabloguia/MacPortsBrew .github/workflows/release.yml @ 89d705b, lines 342-384.
name: p12 import probe
on:
  push:
    branches: [probe/p12-import]
permissions: {}
jobs:
  probe:
    name: ${{ matrix.runner }} / ${{ matrix.format }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel, macos-26]
        # openssl3: .p12 written by OpenSSL 3 (PBES2/AES).
        # keychain: the same identity re-exported by `security export`, the
        # exporter Keychain Access uses — the format the real .p12 files have.
        format: [openssl3, keychain]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Throwaway identities (self-signed, one day, never a real credential)
        env:
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          sw_vers
          d="$RUNNER_TEMP/throwaway"; mkdir -m 700 "$d"; cd "$d"
          o3="$(brew --prefix openssl@3)/bin/openssl"
          "$o3" version
          /usr/bin/openssl version
          for role in app installer; do
            "$o3" req -x509 -newkey rsa:2048 -nodes -days 1 \
              -subj "/CN=MPB throwaway $role/O=Throwaway" \
              -addext "keyUsage=critical,digitalSignature" \
              -addext "extendedKeyUsage=codeSigning" \
              -addext "basicConstraints=critical,CA:FALSE" \
              -keyout "$role.key" -out "$role.crt" 2>/dev/null
            pw="$("$o3" rand -hex 16)"; echo "::add-mask::$pw"
            "$o3" pkcs12 -export -inkey "$role.key" -in "$role.crt" \
              -passout "pass:$pw" -out "$role.p12"
            if [ "$FORMAT" = keychain ]; then
              ekc="$d/export-$role.keychain-db"
              /usr/bin/security create-keychain -p throwaway "$ekc"
              /usr/bin/security unlock-keychain -p throwaway "$ekc"
              /usr/bin/security import "$role.p12" -k "$ekc" -f pkcs12 -P "$pw" -A
              /usr/bin/security export -k "$ekc" -t identities -f pkcs12 -P "$pw" -o "$role-kc.p12"
              /usr/bin/security delete-keychain "$ekc"
              mv "$role-kc.p12" "$role.p12"
            fi
            echo "--- $role.p12 encryption ($FORMAT):"
            "$o3" pkcs12 -in "$role.p12" -info -noout -passin "pass:$pw" 2>&1 || true
            if [ "$role" = app ]; then up=APP; else up=INSTALLER; fi
            echo "MPB_${up}_CERT_B64=$(/usr/bin/base64 -i "$role.p12" | tr -d '\n')" >>"$GITHUB_ENV"
            echo "MPB_${up}_CERT_PASSWORD=$pw" >>"$GITHUB_ENV"
          done
          rm -f ./*.key ./*.p12

      - name: Import (verbatim from release.yml), then use the identity
        run: |
          set -euo pipefail
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          umask 077
          ossl=/usr/bin/openssl
          sec=/usr/bin/security
          cred="$RUNNER_TEMP/mpb-cred"
          # `security -i` splits its input line on whitespace, so a path with a
          # space would name more than one keychain. Hosted runners have none;
          # that is asserted here, before any keychain exists, not assumed.
          case "$cred" in
            *[!A-Za-z0-9/._-]*)
              echo "::error title=Refused::RUNNER_TEMP holds a character security -i would split on; nothing was signed"
              exit 1 ;;
          esac
          /bin/mkdir -m 700 "$cred"
          kc="$cred/signing.keychain-db"
          kc_pw="$("$ossl" rand -hex 24)"
          echo "::add-mask::$kc_pw"
          WRAP_PW="$("$ossl" rand -hex 24)"
          echo "::add-mask::$WRAP_PW"
          export WRAP_PW
          # printf is a builtin: the command line, password included, is
          # written to the pipe and is never any process's argument.
          sec_i() { printf '%s\n' "$1" | "$sec" -i; }
          sec_i "create-keychain -p $kc_pw $kc"       || exit 1
          sec_i "set-keychain-settings -lut 3600 $kc" || exit 1
          sec_i "unlock-keychain -p $kc_pw $kc"       || exit 1

          import_identity() { # <base64 variable name> <password variable name>
            printf '%s' "${!1}" | /usr/bin/base64 --decode >"$cred/in.p12"
            "$ossl" pkcs12 -export -passout env:WRAP_PW -out "$cred/wrapped.p12" \
              -in <("$ossl" pkcs12 -in "$cred/in.p12" -passin "env:$2" -nokeys) \
              -inkey <("$ossl" pkcs12 -in "$cred/in.p12" -passin "env:$2" -nocerts -nodes)
            sec_i "import $cred/wrapped.p12 -k $kc -f pkcs12 -P $WRAP_PW -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild" >/dev/null || exit 1
            /bin/rm -f "$cred/in.p12" "$cred/wrapped.p12"
          }
          import_identity MPB_APP_CERT_B64 MPB_APP_CERT_PASSWORD
          unset MPB_APP_CERT_B64 MPB_APP_CERT_PASSWORD
          import_identity MPB_INSTALLER_CERT_B64 MPB_INSTALLER_CERT_PASSWORD
          unset MPB_INSTALLER_CERT_B64 MPB_INSTALLER_CERT_PASSWORD
          sec_i "set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $kc_pw $kc" >/dev/null || exit 1
          existing="$("$sec" list-keychains -d user | /usr/bin/tr -d '"' | /usr/bin/xargs)"
          # shellcheck disable=SC2086
          "$sec" list-keychains -d user -s "$kc" $existing
          unset kc_pw WRAP_PW

          echo "--- identities in the signing keychain:"
          "$sec" find-identity -p basic "$kc"
          for role in app installer; do
            "$sec" find-identity -p basic "$kc" | grep -q "MPB throwaway $role" \
              || { echo "::error::identity '$role' not in the keychain after import"; exit 1; }
          done
          # Non-interactive use of the private key proves the partition list.
          /bin/cp /usr/bin/true "$RUNNER_TEMP/probe-bin"
          /usr/bin/codesign --force --timestamp=none -s "MPB throwaway app" \
            --keychain "$kc" "$RUNNER_TEMP/probe-bin"
          /usr/bin/codesign -dvv "$RUNNER_TEMP/probe-bin" 2>&1 | grep -E '^(Authority|Identifier)='
          echo "PROBE OK: import + partition list + codesign on $(sw_vers -productVersion) $(uname -m)"

      - name: Remove the keychain
        if: always()
        run: |
          /usr/bin/security delete-keychain "$RUNNER_TEMP/mpb-cred/signing.keychain-db" 2>/dev/null || true
          /bin/rm -rf "$RUNNER_TEMP/mpb-cred" "$RUNNER_TEMP/throwaway"
