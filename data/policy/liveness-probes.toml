# SPDX-License-Identifier: Apache-2.0
#
# The curated liveness probes (DP-051 (a); docs/passes/16-liveness-design.md;
# docs/research/R-28-liveness-probes.md). A row is the security decision: a flag
# is not safe by default, and `httpd --version` starts a server and exits 0
# (R-28 E-4). So this file is an allowlist of what was seen, and nothing else.
#
# Keyed (provider, package, executable), because a leaf is not a program:
# `pkg-config` is pkgconf under one provider and pkg-config under the other.
# `provider` names the destination; both migration directions read one row.
#
# OBSERVED ROWS ONLY. `argv` is arguments, never a program or a path: exactly one
# of `--version`, `-version`, `-V`, `-v`, and growing that set is a reviewed code
# change. `observed_version` is in the shape the owner rule answers, revision
# included. A probe runs only at exactly that version (condition 6 of the
# admission, `process/probe.rs`), and only while the build observes the probe
# (`THIS_BUILD_OBSERVES_LIVENESS_PROBE`, false in this build).
#
# THE SCOPE OF THE ACCEPTANCE (security-reviewer, 2026-11-13 and 2026-11-14;
# docs/passes/16-plans/H.md, "Plan (H-4)"): the eleven (provider, package,
# executable, observed_version) keys below, on x86_64 macOS 26.7.3 (25G342). The
# rows were first qualified on 26.7.2 (2026-11-04); the scope stands on the two
# recorded-attempt rounds of R-28 (2026-11-13 and 2026-11-14), counted together,
# at least three runs per row in which the sandbox's reporting was seen live. What
# nothing enforces: the OS build; the machine's architecture and Rosetta (condition
# 11 admits a Mach-O for this build's architecture, not the one a row was
# qualified on); and the binary itself, since a version is a label (a MacPorts
# variant, a Homebrew bottle rebuild or a source build can differ at the same
# version and revision).
#
# QUALIFYING A NEW OR CHANGED ROW includes a recorded-attempt round: under the
# reporting sandbox of R-28's "Attempted writes, recorded", both controls, at
# least three canary-seen runs, in the deployed form (argv[0] the placed leaf).
# That is a procedure, not a check: nothing stops a row added without it. A row
# that does not reach it is not in this file; "unqualified" means absent.
#
# How every row here was qualified on 2026-11-04 (x86_64, one machine; absence is
# bounded by this sample):
#   - run as the canonical path with arg0 = the placed leaf (under the sandbox arg0
#     is the path), from a scratch path with a space in it, serving as HOME, TMPDIR
#     and the working directory, with the design note's exact environment;
#   - exit 0 under the destination's bin plus the system PATH, and under the
#     system PATH alone;
#   - exit 0 again under a sandbox denying the network, every exec but the program
#     itself, and every write outside scratch. So neither was needed, which is what
#     the sandbox can show; it does not show a program never tries;
#   - exit 0 again, plain and under that sandbox, with the scratch `chmod 555`. Four
#     rounds, with no cold/warm split (R-28's last section);
#   - nothing written in scratch, no process left, no crash report, xcrun's cache
#     unchanged, nothing new under ~/Library naming the program, a search by name
#     and not exhaustive (R-28's last section says what it left out);
#   - a compiled program, not an env script; a regular file, no setuid or setgid
#     (R-28's last section records these).
#
# The Homebrew `gettext` row lands and is not reached today: its keg holds Java
# classes, which stop the probe (R-27, Ruling on Java classes).
#
# R-28's row 8 (macports, gettext, gettext) did not requalify and is absent: the
# file placed as `gettext` belongs to the port `gettext-runtime`. Rows 14-15 (`rg`)
# were cited and never observed, and do not land. R-28's row 12 (homebrew,
# pkgconf, pkg-config) was removed on 2026-11-14: in the deployed form,
# argv[0] = pkg-config, one canary-seen run in ten against the three required
# (security-reviewer, H-4). It may return when that form reaches three, or when
# a detection that does not depend on the log exists. A package any
# stateful-packages.toml family lists, under any provider, is a load error.

[[probe]]
provider = "homebrew"
package = "gettext"
executable = "gettext"
argv = ["--version"]
observed_version = "1.0"
source = "Observed: R-28 row 7, re-qualified as above; printed `gettext (GNU gettext-runtime) 1.0`"
read_on = "2026-11-04"

