# SPDX-License-Identifier: Apache-2.0
#
# The commands a migration plan would run, per provider, and whether each
# needs elevation. This is data (INV-20): the binary renders these verbs
# into a plan and has no code path that executes them (SE-020). A later pass
# that adds the executor reads the same table.
#
# Elevation follows docs/research/R-5-privilege-requirements.md: MacPorts
# writes into a root-owned prefix, so add/remove/select/service operations
# elevate; Homebrew's prefix subdirectories are user-owned, so formula
# operations do not - but a cask with a `sudo:` stanza does, which is why the
# Homebrew entry marks cask operations `unknown` until the planner can read
# the cask's own metadata (deferred with the executor).

[[entry]]
provider = "homebrew"
executable = "bin/brew"
source = "https://docs.brew.sh/Manpage (install, uninstall, link, list); Library/Homebrew/brew.sh check-run-command-as-root @ 560147012b9678b42ef5e83b690f0895552d1366 (list, and so verify); docs/research/R-5-privilege-requirements.md; docs/research/R-5a-verify-command-elevation.md. The `[entry.success]` cells are two observations on this machine, Homebrew 6.0.21: the verify verb on an installed formula exits 0 with the name and version (R-5a E1, 2026-09-04), and on a name that is not installed exits 1 with no output (2026-09-06, recorded in the F-33 section of docs/passes/02-ARCHITECTURE-REVIEW-findings.md). `add` and `remove` are cited to the Manpage, not re-observed, because running them would mutate this machine (INV-05)"
read_on = "2026-09-06"
elevation_reason = "Homebrew refuses to run as root; its prefix subdirectories are owned by the user (docs.brew.sh/FAQ, read 2026-09-02)."

[entry.verbs]
add = ["install"]
remove = ["uninstall"]
verify = ["list", "--versions"]

# How an executor establishes that each command succeeded. Exit status is not
# the universal answer - see the MacPorts entry, where for one verb it carries
# no information at all - so it is stated rather than assumed (F-33).
#
# Homebrew's is exit status, and that is an observation rather than an
# inference - but the two halves come from two reads on two dates, and the
# first version of this comment cited one wrong note and one wrong date for
# both (spec-guardian, 2026-09-18). Positive case: the verify verb on an
# installed formula exits 0 and prints the name and version, R-5a E1, observed
# 2026-09-04. Negative case: the same verb on a name that is not installed
# exits 1 with no output, observed 2026-09-06 and recorded in the F-33 section
# of docs/passes/02-ARCHITECTURE-REVIEW-findings.md, which is a findings file
# rather than a research note - stated here rather than quietly re-cited,
# because where an observation lives is part of how the next reader checks it.
[entry.success]
add = "exit_status"
remove = "exit_status"
verify = "exit_status"

[entry.elevation]
add = "none"
remove = "none"
add_gui_app = "unknown"
remove_gui_app = "unknown"
# A read, and not by inference: `list` is absent from the exemption list in
# `check-run-command-as-root` in the shipped `Library/Homebrew/brew.sh`, so
# `sudo brew list` aborts rather than merely being unnecessary. Homebrew 6.0.21,
# `Homebrew/brew` HEAD 560147012b9678b42ef5e83b690f0895552d1366, observed
# 2026-09-04 (R-5a). Note the entry-level `source` below cites the FAQ, which
# names no subcommand; this cell's source is `brew.sh` at that revision.
verify = "none"
# Same command, same answer. Verifying a cask does not elevate either - but see
# finding F-22: `brew list --versions` is formula-only once a name is given, so
# the *verb* is wrong for a cask even though the elevation is right.
#
# F-22 asked whether that matters, and the answer is: not today. A cask carries
# `PackageClass::GuiApp`, which forces `MANUAL_REVIEW` (INV-19), and a plan that
# halts there emits no commands at all - so this cell, and the three other
# `_gui_app` cells in this file, are read by nothing. Pinned by
# `crates/application/tests/planner_casks.rs`, which also fails if a cask ever
# reaches a `--versions` argv.
#
# They stay rather than being deleted for two reasons. The loader refuses an
# operation that has an elevation for one package kind and not the other (F-10),
# so removing them breaks that check; and the wrong verb becomes live the moment
# casks are made plannable, at which point `[entry.verbs]` needs a kind-aware
# form it does not currently have. The comment is the handover.
verify_gui_app = "none"
# Cross-provider primary goes through the MacPortsBrew-managed directory in
# the user's home (SE-036), never through the provider.
set_primary = "none"
# A cask is selected the same way, through the same directory, so the answer is
# the same. Stated because the loader refuses an operation that has an elevation
# for one package kind and not the other, and because `set_primary` was the one
# operation the first version of that check could not see: it is in this table
# and not in `[entry.verbs]`, which is what the check was iterating.
set_primary_gui_app = "none"

[[entry]]
provider = "macports"
executable = "bin/port"
source = "https://guide.macports.org (using.port.install, using.port.uninstall, section 6.5 Registry Files); macports.conf(5) portdbpath; docs/research/R-5-privilege-requirements.md; docs/research/R-5a-verify-command-elevation.md; the `verify` elevation cell is an observation on this machine, not a citation - MacPorts 2.12.6 on macOS 26.6.2 (25G83), prefix /opt/local: as a non-root user `port -q installed` exits 0 and registry.db is 0644 (R-5a UNRESOLVED-1 and -2, F-24). Re-observed 2026-09-08 with three ports installed, which the 2026-09-06 read could not do: the elevation answer is unchanged, and `port -q installed` exits 0 for an installed port, an absent one, and a name that is not a port at all (R-5 E22, F-33)"
read_on = "2026-09-08"
elevation_reason = "The default MacPorts prefix /opt/local is created by the installer and owned by root (guide.macports.org, read 2026-09-02)."
# Words `port` reads as a *set of ports* wherever a portname goes, so a package
# called one of these is not a package: removing the set named `installed` is
# the documented way to remove the whole installation.
#
# This is a safety guard, not a fidelity record, so it is deliberately a
# superset of what is documented. The twelve verified entries are the list
# docs/research/R-3-macports-read-interfaces.md checked against port.1 on
# 2026-09-02. `actinact` is added even though neither of that note's passes
# returned it: no port is named `actinact`, so over-inclusion costs nothing,
# while under-inclusion costs an installation. The comparison folds case for the
# same reason - `port`'s own case behaviour is not documented in either source,
# and every extra match here is a refusal rather than an action.
reserved_names = [
  "all", "current", "active", "inactive", "actinact", "installed",
  "uninstalled", "outdated", "obsolete", "requested", "unrequested",
  "leaves", "rleaves",
]

[entry.verbs]
add = ["install"]
remove = ["uninstall"]
verify = ["-q", "installed"]

# `verify` is the one cell in this file where exit status is not the answer,
# and it is why this table exists (F-33). Observed on this machine 2026-09-08,
# MacPorts 2.12.6, three ports installed (R-5 E22): the read verb exits 0 for
# an installed port, for a real port that is absent, and for a name that is
# not a port at all - three cases, one exit status, and the output is the only
# thing that differs.
#
# So a VERIFY_DESTINATION toward MacPorts driven by exit status can never
# fail - and INV-01 puts that step in front of REMOVE_SOURCE, which makes it a
# data-loss path rather than a cosmetic one. `stdout_names_package` says what
# an executor must do instead: the port's own name has to appear in the
# output, and an empty stdout is a failure however the process exited.
#
# The other two verbs are exit status, cited rather than observed: both are
# documented to fail nonzero (guide.macports.org, using.port.install and
# using.port.uninstall, read 2026-09-04), and neither was re-run here because
# doing so would mutate this machine (INV-05).
[entry.success]
add = "exit_status"
remove = "exit_status"
verify = "stdout_names_package"

[entry.elevation]
add = "required"
remove = "required"
# MacPorts has no GUI-application package kind; stated so the planner never
# reaches an elevation value by omission.
add_gui_app = "unknown"
remove_gui_app = "unknown"
# Observed 2026-09-06, and no longer a citation. MacPorts 2.12.6 was installed
# on this machine (macOS 26.6.2 build 25G83, x86_64, default prefix /opt/local,
# zero ports installed), and R-5a UNRESOLVED-1's two commands were run as the
# non-root user:
#
#   stat -f '%Su %Sg %Sp %N' .../registry .../registry/registry.db
#     -> root wheel drwxr-xr-x  registry
#     -> root wheel -rw-r--r--  registry.db
#   port -q installed          -> exit 0, empty
#   port -q installed <port>   -> exit 0, empty
#
# So reading the registry needs no elevation, and R-5a UNRESOLVED-2 - the
# database file's mode, undocumented and umask-dependent - is 0644 on a default
# install. The evidence R-5a called "pointing but not stating" pointed the right
# way.
#
# One divergence worth keeping: R-5a cites the registry *directory* as
# root:admin 0755 from macports-base `doc/base.mtree.in`. Observed here it is
# root:**wheel**. The mode matches; the group does not. Only one machine, so
# this is recorded rather than generalised.
#
# The observation is carried in this entry's `source` field and `read_on`, not
# only in this comment: INV-20 wants provenance in a field, and the loader checks
# fields. `read_on` is the newest read in the entry, which is now this
# observation; the documentation citations beside it are still dated 2026-09-04
# and the `source` string says which part is which. Per-cell provenance would be
# better - Homebrew's `verify` cell wants it too - and is a schema change, so it
# is recorded rather than improvised (F-35).
#
# **Both cases are now observed** (2026-09-08, this machine, MacPorts 2.12.6
# with three ports installed; R-5 E22). The earlier note here said the positive
# case was unknown because nothing was installed. It is now known, and the
# answer is worse than the gap it replaced:
#
#   port -q installed htop                     -> exit 0, "  htop @3.5.2_0 (active)"
#   port -q installed wireshark                -> exit 0, no output
#   port -q installed definitely-not-a-port    -> exit 0, no output
#
# Installed, real-but-absent, and *not a port at all* are one exit status. The
# elevation answer is unchanged and confirmed - reading a 0644 file owned by
# root needs no privilege - but `verify` cannot be driven by exit status on this
# provider, which is F-33 and is now recorded as executor debt in
# `docs/schemas/plan.v1.md`.
#
# Runtime capability detection remains the real answer (INV-20: detection wins
# over stored knowledge). One machine is a better default than `unknown`, not a
# substitute for detecting.
verify = "none"
# MacPorts has no GUI-application package kind, as `add_gui_app` above already
# records. Stated so the planner never reaches a value by omission.
verify_gui_app = "unknown"
# Cross-provider primary goes through the MacPortsBrew-managed directory
# (SE-036); the provider's own intra-provider selection mechanism needs
# elevation and is proposed to the user, not run.
set_primary = "none"
# MacPorts has no GUI-application package kind, as the cells above record.
set_primary_gui_app = "none"
