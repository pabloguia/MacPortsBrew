data_paths = { homebrew = ["var/lib/influxdb"] }
source = "docs/research/R-8-stateful-and-service-packages.md E-6, finding 9"
read_on = "2026-09-02"
rationale = """
The data directory is passed as a service argument (--data-dir), so it is \
visible in metadata, but the time-series data itself is version-coupled. \
Counterpart port not verified.\
"""

[[entry]]
family = "grafana"
