"""

[[entry]]
family = "prometheus"
names = { homebrew = ["prometheus"] }
data_paths = { homebrew = ["var/prometheus"] }
source = "docs/research/R-8-stateful-and-service-packages.md E-6, finding 9"
read_on = "2026-09-02"
rationale = """
The time-series database sits under var/prometheus, set by a service \
