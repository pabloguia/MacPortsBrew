data_paths = { homebrew = ["var/lib/cassandra"] }
source = "docs/research/R-8-stateful-and-service-packages.md E-6, finding 9"
read_on = "2026-09-02"
rationale = """
Cluster state and commit logs under var/lib/cassandra. Counterpart port not \
