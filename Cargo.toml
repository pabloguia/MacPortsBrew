[workspace]
resolver = "2"
members = [
  "crates/domain",
  "crates/policy",
  "crates/application",
  "crates/adapters",
  "crates/cli",
]

# One crate per layer (docs/spec/07-quality-and-testing.md, "Suggested
# layering"): the dependency edges between crates are the layering rule, so
# `domain` and `policy` cannot import an adapter without changing a Cargo.toml,
# and scripts/check-layering.sh asserts the edges from `cargo metadata`.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pabloguia/MacPortsBrew"
description = "See what Homebrew and MacPorts have installed on macOS, compare them package by package, and plan a migration in either direction."
# Distributed as signed release artifacts, not through crates.io; the internal
# path dependencies carry no version, so a publish would fail anyway.
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "0.9"
unicode-width = "0.2"
clap = { version = "4.5", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The domain is full of enums whose exhaustive handling is the point;
# `match_same_arms` would push toward wildcard arms, which is the failure mode
# 02-domain-model.md warns about.
match_same_arms = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
# Orchestration functions (analysis, planner, doctor) are long by nature;
# splitting them for a line count hides the sequence they exist to show.
too_many_lines = "allow"
# Shell execution anywhere but the central executor is a threat-model
# violation (04-migration-and-safety.md). The executor is the only module
# allowed to construct a std::process::Command; scripts/check-layering.sh
# asserts that textually.

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
